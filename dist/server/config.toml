[server]
listen_addr = "0.0.0.0:7777"
cert_file   = ""   # vazio = TLS self-signed gerado automaticamente
key_file    = ""

[database]
# driver = "sqlite"   → zero instalação, arquivo local (padrão dev)
# driver = "postgres" → PostgreSQL para produção
driver = "sqlite"
dsn    = "./rco.db"

# Para usar PostgreSQL, troque para:
# driver = "postgres"
# dsn    = "postgres://rco:rco@localhost:5432/rco?sslmode=disable"

[game]
login_message = "Welcome to RealmCrafter: Origins"
max_players   = 500

[movement]
# Server-side movement validation tuning.
min_delta_sec       = 0.016
max_delta_sec       = 1.0
base_step_allowance = 0.75
max_move_speed      = 18.0
speed_slack_mult    = 1.25
max_below_ground    = 1.0
# groundY is heightmap-only (server has no coldata.bin/collision data) —
# widened well past terrain to give elevated static geometry (bridges,
# platforms) room, otherwise standing on one gets rejected as an
# "impossible height" and the player is silently frozen/yanked back.
# Trades some Y-axis anti-cheat precision for correctness; see the
# MaxAboveGround comment in server/internal/net/client.go.
max_above_ground    = 40.0
enable_telemetry    = false
log_rejections      = true
telemetry_sample_ms = 500

[features]
# Habilita o runtime de combate data-driven (ability templates + loadouts NPC).
combat_ability_runtime = true
